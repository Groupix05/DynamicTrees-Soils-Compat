pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.100media.dev/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        // Extra Delight Dev Dependency Repositories:
        maven {
          // Maven for PatchouliProvider
          name = "BlameJared's maven"
          url = 'https://maven.blamejared.com'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
    id 'com.nyfaria.moddingtools' version '1.2.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'DynamicTrees-Soils-Compat'
include("common")
include("fabric")
include("neoforge")
