
plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
    alias(nyfs.plugins.loom) apply false
    alias(nyfs.plugins.mdg) apply false
    alias(nyfs.plugins.regutils)
}
configurations.all {
    resolutionStrategy.cacheDynamicVersionsFor(1, "seconds")
}

registrationUtils {
    group "${project.group}.${mod_id}.registration"
    projects {
        fabric {
            type 'fabric'
        }
        neoforge {
            type 'neoforge'
        }
        common {
            type 'common'
        }
    }
}

